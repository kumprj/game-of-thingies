AWSTemplateFormatVersion: '2010-09-09'

Description: "Game of Things production DynamoDB tables (Games, Entries, Scores). Items expire a day after their last write via TTL on expiresAt."

# Deployed as the GameOfThings stack. sst.config.ts references these tables by name in production.
#   aws cloudformation deploy --stack-name GameOfThings --template-file cfn_tables.yml

Resources:

  GamesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: Games
      AttributeDefinitions:
        - AttributeName: gameId
          AttributeType: S
      KeySchema:
        - AttributeName: gameId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  EntriesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: Entries
      AttributeDefinitions:
        - AttributeName: gameId
          AttributeType: S
        - AttributeName: entryId
          AttributeType: S
      KeySchema:
        - AttributeName: gameId
          KeyType: HASH # Partition key
        - AttributeName: entryId
          KeyType: RANGE # Sort key
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ScoresTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: Scores
      AttributeDefinitions:
        - AttributeName: gameId
          AttributeType: S
        - AttributeName: playerName
          AttributeType: S
      KeySchema:
        - AttributeName: gameId
          KeyType: HASH       # Partition key
        - AttributeName: playerName
          KeyType: RANGE      # Sort key
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

Outputs:

  GamesTableName:
    Value: !Ref GamesTable

  EntriesTableName:
    Value: !Ref EntriesTable

  ScoresTableName:
    Value: !Ref ScoresTable
