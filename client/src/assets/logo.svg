<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Game of Things">
<style>
  .ink { fill: #3f464d; }
  .ring { fill: none; stroke: #3f464d; stroke-width: 9; }
  .spin { fill: none; stroke-width: 9; stroke-linecap: round; transform-origin: 200px 200px; }
  .a1 { stroke: #ff8a3d; stroke-dasharray: 90 2000; }
  .a2 { stroke: #ffc53d; stroke-dasharray: 50 2000; rotate: 120deg; }
  .a3 { stroke: #ff5e7e; stroke-dasharray: 30 2000; rotate: 240deg; }
  .l { font: 900 30px "Avenir Next", "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
       fill: #3f464d; text-anchor: middle; dominant-baseline: central; }
  .speed line { stroke: #ff8a3d; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 26 60; }
  .speed line:nth-child(2) { stroke: #ffc53d; }
  .speed line:nth-child(3) { stroke: #ff5e7e; }
  .puff { fill: #c9ced3; opacity: 0; }
  .l { animation: wave 1.6s ease-in-out; transform-box: fill-box; transform-origin: center; }
  #horse { animation: gallop 1.0s ease-in-out 2; transform-origin: 200.0px 230.0px; }
  #mane { animation: flutter 0.5s ease-in-out 4; transform-origin: 277.4px 84.8px; }
  #forelock { animation: flutter 0.5s ease-in-out 4 reverse; transform-origin: 293.0px 77.0px; }
  #ffront { animation: swing 1.0s ease-in-out 2; transform-origin: 272.2px 184.6px; }
  #fhind { animation: swing 1.0s ease-in-out 2 reverse; transform-origin: 183.8px 191.4px; }
  .speed line { animation: zoom 1.0s linear 2; }
  .speed line:nth-child(2) { animation-delay: -0.33s; }
  .speed line:nth-child(3) { animation-delay: -0.67s; }
  .puff { animation: puff 1.0s ease-out 2; transform-box: fill-box; transform-origin: center; }
  .puff:nth-of-type(2) { animation-delay: 0.5s; }
  .spark { animation: twinkle 1.0s ease-in-out 2; transform-box: fill-box; transform-origin: center; }
  .spark:nth-of-type(2) { animation-delay: 0.4s; }
  .spark:nth-of-type(3) { animation-delay: 0.8s; }
  .spin { animation: orbit 3.0s ease-in-out; }

  @keyframes gallop {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-10px) rotate(-4deg); }
    50% { transform: translateY(-3px) rotate(0deg); }
    75% { transform: translateY(-8px) rotate(3deg); }
  }
  @keyframes flutter {
    0%, 100% { transform: none; }
    25% { transform: rotate(-4deg) skewX(-6deg); }
    75% { transform: rotate(5deg) skewX(4deg); }
  }
  @keyframes swing { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(16deg); } }
  @keyframes zoom { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 86; } }
  @keyframes puff { 0% { opacity: .9; transform: translateX(0) scale(.4); } 100% { opacity: 0; transform: translateX(-26px) scale(1.4); } }
  @keyframes wave { 0%, 60%, 100% { transform: translateY(0) scale(1); } 25% { transform: translateY(-7px) scale(1.12); fill: #ff8a3d; } }
  @keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); } 50% { opacity: .2; transform: scale(.4) rotate(90deg); } }
  @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<circle cx="200" cy="200" r="190" fill="#fff"/>
<circle class="ring" cx="200" cy="200" r="178"/>
<circle class="spin a1" cx="200" cy="200" r="178"/>
<circle class="spin a2" cx="200" cy="200" r="178"/>
<circle class="spin a3" cx="200" cy="200" r="178"/>

<g class="speed">
  <line x1="70" y1="204" x2="138" y2="204"/>
  <line x1="56" y1="220" x2="128" y2="220"/>
  <line x1="72" y1="236" x2="134" y2="236"/>
</g>
<circle class="puff" cx="134" cy="258" r="8"/>
<circle class="puff" cx="236" cy="246" r="6"/>

<path class="spark" fill="#ffc53d" d="M190 40 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
<path class="spark" fill="#ff5e7e" d="M96 108 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5z"/>
<path class="spark" fill="#ff8a3d" d="M338 176 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>

