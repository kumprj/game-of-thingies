name: CI

# Checks the server and web client. Runs on every PR, whatever its base, so
# stacked PRs are checked too. Not on pushes to main: main is protected, so everything there was
# already checked on its PR. The jobs run in parallel. GitHub-hosted runners only: this repo is
# public, and fork PRs must not run on self-hosted machines.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # tsc && vite build
      - run: npm run build

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - name: Server unit tests
        run: npm test -- --coverage
      - run: npm ci
        working-directory: client
      - name: Client unit tests
        run: npx vitest run --coverage
        working-directory: client

  # Plays whole games through the HTTP API and Socket.IO against DynamoDB Local
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Server integration tests
        run: npm run test:integration -- --coverage

  # Keep the legacy job id because it is a required branch-protection check. It now verifies the
  # deployable Lambda boundary instead of the retired container image.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify Lambda request handling
        run: npm test -- server/lambda.test.ts
